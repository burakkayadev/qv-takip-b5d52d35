name: Quietvox Yedek (Google Drive)

# Haftalık tam proje yedeği: repodaki her şey (kod, iş akışları, data.json, MODEL_BRIDGE.md, kılavuz)
# tek ZIP olur. ZIP her zaman Actions "artifact" olarak 90 gün saklanır; RCLONE_CONFIG Secret'ı
# tanımlıysa ayrıca Google Drive'a yüklenir. git archive kullanıldığı için .gitignore'daki dosyalar
# (android-signing, cookies.json, yerel yedekler) asla bu yedeğe girmez.
on:
  schedule:
    # Pazar 00:30 UTC = 03:30 Türkiye saati
    - cron: '30 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quietvox-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: ZIP oluştur
        run: |
          NAME="QuietVox_Yedek_$(TZ=Europe/Istanbul date +%Y-%m-%d)"
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
          echo "NAME=${NAME}" >> "$GITHUB_ENV"
          ls -lh "${NAME}.zip"

      - name: Yedeği Actions'ta sakla (90 gün)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip
          retention-days: 90

      - name: Google Drive'a yükle
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
          DRIVE_FOLDER: ${{ secrets.DRIVE_BACKUP_FOLDER }}
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "::notice::RCLONE_CONFIG Secret'ı yok; Drive'a yükleme atlandı (yedek bu çalıştırmada artifact olarak duruyor). Kurulum: README → Yedekleme."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          FOLDER="${DRIVE_FOLDER:-QuietVox_Yedekler}"
          rclone copy "${NAME}.zip" "gdrive:${FOLDER}/"
          echo "Drive'a yüklendi: ${FOLDER}/${NAME}.zip"
          # 120 günden eski haftalık yedekler silinir (Drive dolmasın)
          rclone delete "gdrive:${FOLDER}/" --min-age 120d --include "QuietVox_Yedek_*.zip" || true
