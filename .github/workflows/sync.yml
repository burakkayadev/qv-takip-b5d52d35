name: Quietvox Senkronizasyon

on:
  # YEDEK zamanlayıcı. GitHub'ın cron'u yoğun saatlerde çalıştırmaları atlıyor: saatlik cron'dan
  # günde yalnızca ~3 çalıştırma geldi ve uygulama 6+ saat eski veride kaldı (19.11.2026). Asıl
  # düzen aşağıdaki "next" işidir: her senkron bittikten ~20 dk sonra bir sonrakini kendisi
  # başlatır (zincir). cron yalnızca zincir koparsa (ör. GitHub kesintisi) yeniden başlatır;
  # yoğun :00/:15 dakikalarından kaçınmak için :07 ve :37 seçildi.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      send_reminder:
        description: 'Yarının teslimat/iade hatırlatmasını ntfy ile gönder'
        type: boolean
        default: false
      reminder:
        description: 'Denemek için hatırlatma türü'
        type: choice
        default: 'yok'
        options: ['yok', 'morning', 'noon', 'evening']

# data.json'ı commit edebilmek için yazma izni; önceki çalıştırmanın sonucunu okumak için actions: read
permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Aynı anda tek senkron; süren iş iptal edilmez, yenisi sıraya girer. Kilit iş düzeyindedir:
    # zincirin bekleyen "next" işi yeni senkronları (ör. bir işlem sonrası) bekletmez.
    concurrency:
      group: quietvox-sync
      cancel-in-progress: false
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      # auto: sırası gelen hatırlatma (08:00 / 13:00 / 18:00 İstanbul, 3 saatlik pencere) günde
      # BİR kez gönderilir; scraper.py gönderileni data.json'a işler (zincir sık çalışsa da tekrar
      # etmez). Elle çalıştırmada seçilen tür doğrudan gönderilir (deneme amaçlı, kaydedilmez).
      - name: Hatırlatma türünü belirle
        id: rem
        env:
          IN_SEND: ${{ inputs.send_reminder }}
          IN_KIND: ${{ inputs.reminder }}
        run: |
          kind=auto
          if [ -n "$IN_KIND" ] && [ "$IN_KIND" != "yok" ]; then
            kind="$IN_KIND"
          elif [ "$IN_SEND" = "true" ]; then
            kind=evening
          fi
          echo "Hatırlatma türü: $kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Kazıyıcıyı çalıştır
        env:
          QV_USER: ${{ secrets.QV_USER }}
          QV_PASS: ${{ secrets.QV_PASS }}
          # İsteğe bağlı ikinci şifre: QV_PASS reddedilirse otomatik denenir
          QV_PASS_BACKUP: ${{ secrets.QV_PASS_BACKUP }}
          # Giriş hatası acil e-postası (saatte en fazla 1). Alıcılar Secret'ta; repoda adres yok.
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # İsteğe bağlı: HTTP Basic katmanı farklı bilgi istiyorsa (boşsa QV_USER/QV_PASS kullanılır)
          QV_HTTP_USER: ${{ secrets.QV_HTTP_USER }}
          QV_HTTP_PASS: ${{ secrets.QV_HTTP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REMINDER: ${{ steps.rem.outputs.kind }}
          # Geçmişe ve ileriye bakılacak gün sayısı (tarih seçici ve aylık rapor için:
          # 62 gün geriye bakınca önceki ayın tamamı her zaman eldedir)
          QV_PAST_DAYS: '62'
          QV_WINDOW_DAYS: '32'
          # Bildirime dokununca açılacak uygulama adresi
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper.py

      # Giriş başarısız olsa bile (login_failed durumu) data.json commit edilebilmeli.
      # Yalnızca data.json eklenir; cookies.json ve debug/ asla commit edilmez.
      - name: data.json değiştiyse commit et ve gönder
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json değişmedi; commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Not: "[skip ci]" eklenmez; GitHub Pages yayınının tetiklenmesini engelleyebilir
          git commit -m "chore: data.json güncellendi"
          bash .github/scripts/push-retry.sh "${GITHUB_REF_NAME}"

      # Senkron bozulursa telefona BİR KEZ haber ver: yalnızca bir önceki çalıştırma başarılıysa
      # (sorun sürdükçe her çalıştırmada bildirim gelmez). Şifre hatası zaten ayrıca bildirilir.
      - name: Senkron bozulduysa bildir
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC tanımlı değil; bildirim atlanıyor."; exit 0; fi
          if grep -q '"status":"login_failed"' data.json; then echo "Giriş hatası ayrıca bildirildi."; exit 0; fi
          previous=$(gh run list -R "$GITHUB_REPOSITORY" -w sync.yml -s completed -L 1 --json conclusion --jq '.[0].conclusion')
          if [ "$previous" != "success" ]; then echo "Önceki çalıştırma da başarısızdı ($previous); tekrar bildirilmiyor."; exit 0; fi
          curl -sS --fail -H "Title: Quietvox" -H "Priority: high" \
            -H "Click: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --data-binary "⚠️ Quietvox senkronu başarısız oldu; uygulamadaki veriler güncellenmiyor olabilir." \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null

  # Zincir: senkron bittikten 20 dk sonra bir sonrakini başlatır (senkron başarısız olsa bile;
  # elle iptal edilen çalıştırma zinciri durdurur). O arada daha yeni bir senkron başladıysa
  # (işlem sonrası, cron ya da uygulama) zinciri o devralır; bu iş yeni çalıştırma başlatmaz.
  next:
    needs: sync
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: 20 dakika bekle ve bir sonraki senkronu başlat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 1200
          # Yalnızca main'deki çalıştırmalara bakılır: başka dalda başlatılan bir senkron zinciri koparmaz
          newest=$(gh run list -R "$GITHUB_REPOSITORY" -w sync.yml -b main -L 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$GITHUB_RUN_ID" ]; then
            echo "Daha yeni bir senkron ($newest) zinciri devraldı; yeni çalıştırma başlatılmıyor."
            exit 0
          fi
          gh workflow run sync.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Bir sonraki senkron başlatıldı."

      # 5 kapılı sağlık denetimi günde 3 kez; GitHub cron'una güvenilemediği için zincir başlatır.
      - name: Sırası geldiyse sağlık denetimini başlat (05/11/17 UTC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hour=$((10#$(date -u +%H)))
          case "$hour" in
            5|11|17) ;;
            *) echo "Sağlık denetimi saati değil ($hour UTC)."; exit 0 ;;
          esac
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w healthcheck.yml -L 1 --json createdAt --jq '.[0].createdAt // ""')
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt 7200 ]; then
            echo "Son sağlık denetimi 2 saatten yeni ($last); atlanıyor."
            exit 0
          fi
          gh workflow run healthcheck.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "Sağlık denetimi başlatıldı."
