name: Quietvox Senkronizasyon

on:
  schedule:
    # Her 30 dakikada bir veri senkronizasyonu (UTC). Dakika 5 ve 35 seçildi:
    # 15:00'teki hatırlatma zamanlamasıyla çakışmasın ve saat başı yoğunluğuna takılmasın
    - cron: '5,35 * * * *'
    # Her gün 15:00 UTC = 18:00 Türkiye saati: yarının hatırlatma bildirimi
    - cron: '0 15 * * *'
    # 05:00 UTC = 08:00 TR: bugün bekleyenler + alınmayı unutulan iadeler
    - cron: '0 5 * * *'
    # 10:00 UTC = 13:00 TR: bugün hâlâ bekleyenler (günün ikinci hatırlatması)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      send_reminder:
        description: 'Yarının teslimat/iade hatırlatmasını ntfy ile gönder'
        type: boolean
        default: false
      reminder:
        description: 'Denemek için hatırlatma türü'
        type: choice
        default: 'yok'
        options: ['yok', 'morning', 'noon', 'evening']

# data.json'ı commit edebilmek için yazma izni; önceki çalıştırmanın sonucunu okumak için actions: read
permissions:
  contents: write
  actions: read

# Aynı anda tek çalışma; süren iş iptal edilmez, yenisi sıraya girer
concurrency:
  group: quietvox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Kazıyıcıyı çalıştır
        env:
          QV_USER: ${{ secrets.QV_USER }}
          QV_PASS: ${{ secrets.QV_PASS }}
          # İsteğe bağlı: HTTP Basic katmanı farklı bilgi istiyorsa (boşsa QV_USER/QV_PASS kullanılır)
          QV_HTTP_USER: ${{ secrets.QV_HTTP_USER }}
          QV_HTTP_PASS: ${{ secrets.QV_HTTP_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Hatırlatma türü zamanlamaya göre seçilir; elle çalıştırmada girdiden alınır
          REMINDER: ${{ github.event.schedule == '0 15 * * *' && 'evening' || github.event.schedule == '0 5 * * *' && 'morning' || github.event.schedule == '0 10 * * *' && 'noon' || inputs.send_reminder == true && 'evening' || inputs.reminder != 'yok' && inputs.reminder || '' }}
          # Geçmişe ve ileriye bakılacak gün sayısı (tarih seçici ve aylık rapor için:
          # 62 gün geriye bakınca önceki ayın tamamı her zaman eldedir)
          QV_PAST_DAYS: '62'
          QV_WINDOW_DAYS: '32'
          # Bildirime dokununca açılacak uygulama adresi
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper.py

      # Giriş başarısız olsa bile (login_failed durumu) data.json commit edilebilmeli
      - name: data.json değiştiyse commit et ve gönder
        if: always()
        run: |
          # Yalnızca data.json eklenir; cookies.json ve debug/ asla commit edilmez
          git add data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "data.json değişmedi; commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Not: "[skip ci]" eklenmez; GitHub Pages yayınının tetiklenmesini engelleyebilir
          git commit -m "chore: data.json güncellendi"
          # Araya başka commit girdiyse üzerine taşı ve gönder; data.json çakışırsa
          # bu çalıştırmanın (en yeni) verisi kazanır. Gönderim 3 kez denenir.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "Gönderim başarısız (deneme $attempt); yeniden deneniyor."
            sleep 5
          done
          exit 1

      # Senkron bozulursa telefona BİR KEZ haber ver: yalnızca bir önceki çalıştırma başarılıysa
      # (sorun sürdükçe her 30 dakikada bir bildirim gelmez). Şifre hatası zaten ayrıca bildirilir.
      - name: Senkron bozulduysa bildir
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          if grep -q '"status":"login_failed"' data.json 2>/dev/null; then exit 0; fi
          previous=$(gh run list -R "$GITHUB_REPOSITORY" -w sync.yml -s completed -L 1 --json conclusion --jq '.[0].conclusion' || echo "")
          if [ "$previous" != "success" ]; then echo "Önceki çalıştırma da başarısızdı; tekrar bildirilmiyor."; exit 0; fi
          curl -s -H "Title: Quietvox" -H "Priority: high" \
            -H "Click: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --data-binary "⚠️ Quietvox senkronu başarısız oldu; uygulamadaki veriler güncellenmiyor olabilir." \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null
