name: Quietvox Sağlık Kontrolü (5 Kapı)

on:
  # Asıl tetik: senkron zinciri (sync.yml "next" işi) bunu günde 3 kez (05/11/17 UTC) başlatır.
  # cron yedektir: GitHub zamanlayıcısı çalıştırma atlayabildiği için tek başına güvenilmez.
  schedule:
    - cron: '23 5,11,17 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
  workflow_dispatch:

# Salt okuma: denetim portala ya da depoya hiçbir şey yazmaz (eski --auto-heal kaldırıldı)
permissions:
  contents: read
  actions: read

concurrency:
  group: quietvox-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, 'chore: sürüm numarası güncellendi') && !startsWith(github.event.head_commit.message, 'chore: data.json güncellendi')"
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Node.js kur (index.html JS sözdizimi kontrolü için)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      # Kapı 1 veri tazeliği · 2 iş akışları · 3 canlı portal ↔ data.json (salt okunur)
      # 4 canlı uygulama (masaüstü + iPhone, PIN) · 5 sıfır gerileme.
      # Biri bile kırmızıysa iş kırmızı olur ve uyarı e-postası gönderilir.
      - name: 5 kapı denetimi
        env:
          QV_USER: ${{ secrets.QV_USER }}
          QV_PASS: ${{ secrets.QV_PASS }}
          QV_PASS_BACKUP: ${{ secrets.QV_PASS_BACKUP }}
          QV_HTTP_USER: ${{ secrets.QV_HTTP_USER }}
          QV_HTTP_PASS: ${{ secrets.QV_HTTP_PASS }}
          QV_APP_PIN: ${{ secrets.QV_APP_PIN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          GH_TOKEN: ${{ github.token }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Push sonrası: yayının bu commit'e geçmesi beklenir ve yayına bağlı kapılar (4 uygulama,
          # 5 gerileme) denetlenir. Veri/portal kapıları (1-3) yeni kodla yapılan ilk senkrondan önce
          # eski veriyi ölçeceği için zincirin başlattığı ve zamanlanmış çalıştırmalarda denetlenir.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python tests/system_check.py --send-email --wait-deploy --gates 4,5
          else
            python tests/system_check.py --send-email
          fi

      - name: Raporları sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saglik-raporu-${{ github.run_id }}
          path: |
            debug/system_check.json
            debug/portal_audit.json
          retention-days: 7
          if-no-files-found: ignore
