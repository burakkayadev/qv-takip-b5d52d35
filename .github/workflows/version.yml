name: Update Version Metadata

# Uygulama dosyaları değişip push edildiğinde sürüm numarasını artırır.
# ÖNEMLİ: build numarası version.json, index.html (CURRENT_BUILD) ve sw.js (önbellek adı)
# içine AYNI commit'te yazılır. Böylece "güncelleme var" bandı yalnızca telefondaki eski
# sürüm için çıkar ve güncelleme yapılınca kaybolur (eskiden index.html'deki sayı elle
# sabitlendiği için band güncellemeden sonra da kaybolmuyordu).
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'version.json'
      - 'manifest.json'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icons/**'

permissions:
  contents: write

concurrency:
  group: quietvox-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Kendi sürüm güncelleme commit'lerinde yeniden çalışmaması için ek güvenlik koşulu
    if: "!startsWith(github.event.head_commit.message, 'chore: sürüm numarası güncellendi') && !startsWith(github.event.head_commit.message, 'chore: auto-update version.json')"
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını yaz
        env:
          BUILD: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, re
          build = int(os.environ["BUILD"])
          try:
              with open("version.json", encoding="utf-8") as f:
                  data = json.load(f)
          except (OSError, ValueError):
              data = {"version": "4.0.0"}
          data["build"] = build
          data["commit"] = os.environ["SHA"][:7]
          data["updated_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          for name, pattern, repl in (
              ("index.html", r"var CURRENT_BUILD = \d+;", f"var CURRENT_BUILD = {build};"),
              ("sw.js", r"const VERSION = '[^']*';", f"const VERSION = 'b{build}';"),
          ):
              with open(name, encoding="utf-8") as f:
                  text = f.read()
              new, n = re.subn(pattern, repl, text, count=1)
              if n != 1:
                  raise SystemExit(f"{name}: sürüm satırı bulunamadı")
              with open(name, "w", encoding="utf-8", newline="\n") as f:
                  f.write(new)
          print("build", build)
          PY

      - name: Commit et ve gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json index.html sw.js
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "chore: sürüm numarası güncellendi (build ${{ github.run_number }})"
          # Araya data.json commit'i girerse rebase + artan beklemeyle 5 deneme (sessiz hata yok)
          bash .github/scripts/push-retry.sh "${GITHUB_REF_NAME}"

      - name: Güncelleme bildirim e-postasını gönder
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APP_URL: https://burakkayadev.github.io/qv-takip-b5d52d35/
        run: python3 notify_mail.py --update
