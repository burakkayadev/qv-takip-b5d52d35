name: WhatsApp Sürüm Bildirimi

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-release-notify
  cancel-in-progress: false

jobs:
  notify-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!startsWith(github.event.head_commit.message, 'chore: data.json güncellendi')"
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: GitHub Pages yayınının güncellenmesini bekle (push sonrası)
        if: github.event_name == 'push'
        run: sleep 45

      - name: Canlı HTTP 200 kontrolü ve WhatsApp CallMeBot bildirimi
        env:
          FATHER_PHONE: ${{ secrets.FATHER_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          LIVE_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://burakkayadev.github.io/qv-takip-b5d52d35/?v=$(date +%s)")
          echo "Canlı HTTP kodu: $LIVE_CODE"
          if [ "$LIVE_CODE" != "200" ]; then
            echo "Canlı sayfa HTTP 200 dönmedi: $LIVE_CODE"
            exit 1
          fi

          if [ -z "${FATHER_PHONE:-}" ] || [ -z "${CALLMEBOT_APIKEY:-}" ]; then
            echo "Bilgi: FATHER_PHONE veya CALLMEBOT_APIKEY henüz tanımlı değil; WhatsApp bildirimi atlandı (yeşil tamamlandı)."
            exit 0
          fi

          SW_VER=$(grep -E "const VERSION =" sw.js | head -n 1 | sed -E "s/.*'([^']+)'.*/\1/")
          TS=$(date +%s)
          LINK="https://burakkayadev.github.io/qv-takip-b5d52d35/?v=${TS}"
          SUMMARY="${COMMIT_MSG:-Yeni Quietvox güncellemesi}"

          curl -fsS -G "https://api.callmebot.com/whatsapp.php" \
            --data-urlencode "phone=${FATHER_PHONE}" \
            --data-urlencode "apikey=${CALLMEBOT_APIKEY}" \
            --data-urlencode "text=$(printf 'Quietvox Sipariş Takip güncellendi!\nSürüm: %s\nÖzet: %s\nÖnbelleksiz Link: %s' "${SW_VER:-güncel}" "${SUMMARY}" "${LINK}")"
          echo "WhatsApp bildirimi gönderildi."
