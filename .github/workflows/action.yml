name: Quietvox İşlem
# Her çalıştırma listede hangi sipariş için olduğuyla görünür (sorun takibi için)
run-name: "${{ inputs.action }} · ${{ inputs.order_id }} · ${{ inputs.order_date }}"

# Uygulamadaki "Hazırlandı" / "Teslim Alındı" butonları bu iş akışını tetikler.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'delivered = Hazırlandı, returned = Teslim Alındı'
        type: choice
        required: true
        options: ['delivered', 'returned']
      order_id:
        description: 'QV Booking ID'
        required: true
      order_date:
        description: 'Siparişin takvimdeki günü (YYYY-AA-GG)'
        required: true
      dry_run:
        description: 'Deneme: formu doldur ama KAYDETME'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # işlem bitince senkronu tetiklemek için

# ÖNEMLİ: grup sipariş başınadır. GitHub bir grupta sırada bekleyen yalnızca BİR işi tutar
# ve öncekileri iptal eder; ortak grup kullanıldığında arka arkaya basılan siparişler
# kayboluyordu. Artık farklı siparişler paralel çalışır, aynı sipariş sıraya girer.
concurrency:
  group: quietvox-action-${{ inputs.order_id }}
  cancel-in-progress: false

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QV_USER: ${{ secrets.QV_USER }}
      QV_PASS: ${{ secrets.QV_PASS }}
      QV_PASS_BACKUP: ${{ secrets.QV_PASS_BACKUP }}
      QV_HTTP_USER: ${{ secrets.QV_HTTP_USER }}
      QV_HTTP_PASS: ${{ secrets.QV_HTTP_PASS }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Playwright Chromium kur
        run: python -m playwright install --with-deps chromium

      # Girdiler komut satırına gömülmez, ortam değişkeni olarak verilir (enjeksiyona karşı).
      # Geçici bir hata (zaman aşımı, ağ) olursa 3 kereye kadar yeniden denenir; işlem
      # aynı siparişte tekrarlansa da sonuç aynıdır (zaten Returned ise yine Returned kalır).
      - name: Siparişi Quietvox'ta güncelle
        env:
          QV_ACTION: ${{ inputs.action }}
          QV_ORDER_ID: ${{ inputs.order_id }}
          QV_ORDER_DATE: ${{ inputs.order_date }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          QV_NOTIFY_FAILURE: '0'
        run: |
          for attempt in 1 2 3; do
            if [ "$attempt" = 3 ]; then export QV_NOTIFY_FAILURE=1; fi
            set +e
            python qv_action.py
            code=$?
            set -e
            if [ "$code" = 0 ]; then exit 0; fi
            # 2 = hatalı istek, 3 = giriş başarısız: tekrar denemenin anlamı yok
            if [ "$code" = 2 ] || [ "$code" = 3 ]; then exit "$code"; fi
            echo "Deneme $attempt başarısız (kod $code); 20 sn sonra yeniden denenecek."
            sleep 20
          done
          exit 1

      # Veriyi burada yazmak yerine senkron iş akışı tetiklenir: aynı anda birden fazla
      # işlem bitse bile data.json'a tek bir yerden yazılır, çakışma olmaz.
      - name: Senkronu tetikle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync.yml -R "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}"
