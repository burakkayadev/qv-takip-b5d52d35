    append(left,
      el('div', 'dr-brand', 'QUIETVOX'),
      el('div', 'dr-title', 'Delivery and Return Form'),
      sub ? el('div', 'dr-sub', sub) : null);
    append(head, left, buildQrBlock(order));

    var info = el('div', 'dr-info');
    append(info,
      drCell('Customer', f.customer || order.waybill.client),
      drCell('Reference', f.reference || order.waybill.tour_reference),
      drCell('QV Booking ID', f.qv_booking_id || order.id),
      drCell('Clients', f.clients),
      drCell('Groups', f.groups),
      drCell('Instruction Language', f.instruction_language),
      drCell('Service Start Date', shortDate(f.service_start_date)),
      drCell('Delivery Station', f.delivery_station));

    var eqWrap = el('div', 'dr-eq-wrap');
    append(eqWrap, buildEquipmentPrintBox(f));

    var sign = el('div', 'dr-sign');
    append(sign,
      signatureBox('Delivered by'),
      signatureBox('Received by (Tour Manager)'),
      signatureBox('Returned by'),
      signatureBox('Checked by Quietvox'));

    append(sheet, head, info, eqWrap, sign);
    return append(wrap, sheet);
  }

  // Ekipman satır sayısına göre başlangıç yazı boyutu (pt)
  function equipmentStartPt(rowCount) {
    if (rowCount <= EQUIP_DENSE_ROWS) return 12;
    if (rowCount <= 18) return 10.5;
    if (rowCount <= EQUIP_TWO_COL_ROWS) return 9.5;
    return 8.5;
  }

  // İçerik kutusuna sığana kadar yazıyı küçült (ölçüm ekran dışı düzende yapılır)
  function fitPrintSheets(root) {
    root.querySelectorAll('.wb-v').forEach(function (cell) {
      var inner = cell.firstElementChild;
      if (!inner) return;
      var cs = window.getComputedStyle(cell);
      var room = cell.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var size = parseFloat(cs.fontSize);
      var min = WAYBILL_MIN_PT * PT_TO_PX;
      while (inner.offsetHeight > room && size > min) {
        size = Math.max(min, size * 0.93);
        cell.style.fontSize = size + 'px';
      }
    });

    var wrap = root.querySelector('.dr-eq-wrap');
    var box = root.querySelector('.dr-eq-box');
    if (wrap && box) {
      var rows = Number(box.getAttribute('data-rows')) || 0;
      // İki sütunlu düzende her tabloda satırların yarısı vardır
      var pt = equipmentStartPt(box.classList.contains('two') ? Math.ceil(rows / 2) : rows);
      box.style.fontSize = pt + 'pt';
      while (box.offsetHeight > wrap.clientHeight && pt > EQUIP_MIN_PT) {
        pt = Math.max(EQUIP_MIN_PT, pt * 0.95);
        box.style.fontSize = pt + 'pt';
      }
    }
  }

  // which: 'waybill' (A5) ya da 'form' (A4). Sayfa boyutu yazdırmadan önce ayarlanır.
  function setPageSize(which) {
    var style = document.getElementById('page-size');
    if (!style) {
      style = document.createElement('style');
      style.id = 'page-size';
      document.head.appendChild(style);
    }
    // İki çıktı da A4 kâğıda basılır; WayBill kâğıdın üst yarısını kullanır
    style.textContent = '@page { size: A4; margin: 8mm; }';
  }

  function fillPrintArea(order, which) {
    var sheets = $('#print-sheets');
    var sheet;
    if (which === 'waybill') {
      sheet = buildWaybillSheet(order);
    } else {
      sheet = buildFormSheet(order);
    }
    sheets.replaceChildren(sheet);
    setPageSize(which);
    document.body.classList.add('has-print');
    fitPrintSheets(sheets);
  }

  function clearPrintArea() {
    $('#print-sheets').replaceChildren();
    document.body.classList.remove('has-print');
  }

  // Kart üzerindeki buton: alanı doldur (QR dahil, senkron) ve hemen yazdır
  function printOrder(order, which) {
    fillPrintArea(order, which);
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    var printed = false;
    var go = function () {
      if (printed) return;
      printed = true;
      fitPrintSheets($('#print-sheets')); // yazı tipi geldikten sonra yeniden ölç
      window.print();
    };
    fontsReady.then(go, go);
    window.setTimeout(go, 1500); // yazı tipi hiç gelmezse de yazdır
  }

  /* ---- Önizleme ---- */
  function updatePreviewScale() {
    if (!document.body.classList.contains('pv-open')) return;
    var sheet = document.querySelector('#print-sheets .sheet');
    if (!sheet) return;
    var available = window.innerWidth - 24;
    var scale = Math.min(1, available / sheet.offsetWidth);
    $('#print-root').style.setProperty('--pv-scale', String(scale));
  }

  function openPreview(order, opener, which) {
    fillPrintArea(order, which);
    previewReturnFocus = opener || null;
    var root = $('#print-root');
    document.body.classList.add('pv-open');
    root.setAttribute('aria-hidden', 'false');
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'true');
    root.setAttribute('aria-labelledby', 'pv-title');
    $('#pv-title').textContent = (which === 'waybill' ? 'WayBill (yarım A4) · ' : 'D&R Formu (A4) · ') +
      (order.location_name || order.id || '');
    updatePreviewScale();
    root.scrollTop = 0;
    $('#pv-close').focus();
  }

  function closePreview() {
    if (!document.body.classList.contains('pv-open')) return;
    var root = $('#print-root');
    document.body.classList.remove('pv-open');
    root.setAttribute('aria-hidden', 'true');
    root.removeAttribute('role');
    root.removeAttribute('aria-modal');
    root.style.setProperty('--pv-scale', '1');
    clearPrintArea();
    if (previewReturnFocus && document.contains(previewReturnFocus)) previewReturnFocus.focus();
    previewReturnFocus = null;
  }

  /* ========================================================================
     TEMA (açık / koyu)
     Seçim bu cihazda saklanır; seçim yoksa telefonun kendi ayarı izlenir.
     ======================================================================== */
  function currentTheme() {
    var saved = lsRead(LS_THEME);
    if (saved === 'dark' || saved === 'light') return saved;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme() {
    var theme = currentTheme();
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B0E16' : '#1B2030');
    var btn = $('#btn-theme');
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    btn.setAttribute('aria-label', theme === 'dark' ? 'Açık moda geç' : 'Koyu moda geç');
  }

  function toggleTheme() {
    lsWrite(LS_THEME, currentTheme() === 'dark' ? 'light' : 'dark');
    applyTheme();
  }

  /* ========================================================================
     QUIETVOX'A YAZMA
     Buton, GitHub'daki "Quietvox İşlem" iş akışını tetikler; iş akışı Quietvox'ta
     siparişi günceller. Bunun için bu cihazda bir kez GitHub erişim anahtarı girilir.
     ======================================================================== */
  // GitHub Pages adresinden "sahip/repo" çıkarılır (ör. kullanici.github.io/repo/)
  function repoSlug() {
    var host = /^([^.]+)\.github\.io$/.exec(window.location.hostname);
    var first = window.location.pathname.split('/').filter(Boolean)[0];
    return host && first ? host[1] + '/' + first : '';
  }

  function githubRequest(path, options) {
    var headers = { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + state.token };
    return fetch('https://api.github.com/repos/' + repoSlug() + path,
      Object.assign({ headers: headers }, options || {}));
  }

  // İade adedi kuralı: sarf kalemleri teslimin en fazla %3'ü (yukarı yuvarlanır), diğerleri aynı
  function plannedReturn(item) {
    if (!/^\d+$/.test(item.quantity)) return '';
    var count = parseInt(item.quantity, 10);
    return String(CONSUMABLE_RE.test(item.item) ? Math.ceil(count * CONSUMABLE_PERCENT / 100) : count);
  }

  function closeDialog() {
    var dialog = $('#dlg');
    if (dialog.open) dialog.close();
  }

  function dialogButton(className, text, handler) {
    var btn = el('button', 'btn ' + className, text);
    btn.type = 'button';
    btn.addEventListener('click', handler);
    return btn;
  }

  function showDialog(nodes) {
    var body = $('#dlg-body');
    body.replaceChildren.apply(body, nodes.filter(Boolean));
    var dialog = $('#dlg');
    if (!dialog.open) dialog.showModal();
  }

  function savePending(pending) {
    setState({ pending: pending });
    lsWrite(LS_PENDING, pending);
  }

  // Durumu Quietvox'ta değişmiş işlemleri bekleyenler listesinden çıkar
  function prunePending() {
    if (!state.data) return;
    var keys = Object.keys(state.pending);
    if (!keys.length) return;
    var next = {};
    keys.forEach(function (key) {
      var entry = state.pending[key];
      var tab = entry.action === 'returned' ? 'returns' : 'deliveries';
      var order = ordersOf(tab).filter(function (o) { return orderKey(o, TAB_INFO[tab].kind) === key; })[0];
      var stale = Date.now() - entry.ts > 24 * 60 * 60 * 1000;
      if (order && !reached(order, entry.action) && !stale) next[key] = entry;
    });
    if (Object.keys(next).length !== keys.length) savePending(next);
  }

  function sendAction(order, key, action) {
    var info = ACTIONS[action];
    var id = order.dr_form.qv_booking_id || order.id.split('_')[0];
    var body = JSON.stringify({ ref: 'main', inputs: { action: action, order_id: id, order_date: order.date } });
    closeDialog();
    showToast('Quietvox\'a gönderiliyor…');
    githubRequest('/actions/workflows/' + ACTION_WORKFLOW + '/dispatches', { method: 'POST', body: body })
      .then(function (res) {
        if (res.status === 401 || res.status === 403 || res.status === 404) throw new Error('auth');
        if (!res.ok) throw new Error('http');
        var pending = Object.assign({}, state.pending);
        pending[key] = { action: action, ts: Date.now() };
        savePending(pending);
        setMark(key, info.field, true);
        showToast('Gönderildi. Quietvox\'ta 2–3 dakika içinde ' + info.quietvox + ' olacak.');
        render(true);
        [120000, 210000, 330000].forEach(function (ms) {
          window.setTimeout(function () { loadData(false); }, ms);
        });
      })
      .catch(function (err) {
        showToast(err.message === 'auth'
          ? 'Gönderilemedi: erişim anahtarı geçersiz ya da yetkisiz (⚙ Ayarlar)'
          : 'Gönderilemedi: bağlantıyı kontrol edip tekrar deneyin');
      });
  }

  function returnPreviewList(order) {
    var list = el('ul', 'dlg-list');
    order.dr_form.equipment.forEach(function (item) {
      var planned = plannedReturn(item);
      if (planned === '') return;
      var row = el('li');
      append(row, el('span', '', item.item), el('b', '', item.quantity + ' → ' + planned));
      append(list, row);
    });
    return list.childNodes.length ? list : null;
  }

  function openActionDialog(order, key, action) {
    var info = ACTIONS[action];
    var title = el('h2', '', info.label + ' → Quietvox: ' + info.quietvox);
    title.id = 'dlg-title';
    var who = el('p', '', (order.location_name || order.title) + ' · ' + (order.dr_form.qv_booking_id || order.id));
    var canSend = state.token && repoSlug();
    var markOnly = dialogButton('btn-ghost', 'Yalnızca burada işaretle', function () {
      setMark(key, info.field, true);
      closeDialog();
      render(true);
    });
    var nodes = [title, who];
    if (action === 'returned') {
      nodes.push(el('p', 'dlg-note', 'İade adetleri şöyle yazılacak (teslim → iade):'), returnPreviewList(order));
    } else {
      nodes.push(el('p', 'dlg-note', 'Durum Delivered yapılacak; Self Delivery ve Self Return işaretlenecek.'));
    }
    if (canSend) {
      var buttons = el('div', 'dlg-btns');
      append(buttons, dialogButton('btn-ghost', 'Vazgeç', closeDialog),
        dialogButton('btn-print', 'Onayla ve gönder', function () { sendAction(order, key, action); }));
      nodes.push(buttons, markOnly);
    } else {
      nodes.push(el('p', '', 'Quietvox\'a yazmak için önce ⚙ Ayarlar\'dan erişim anahtarını girin.'));
      var fallback = el('div', 'dlg-btns');
      append(fallback, markOnly, dialogButton('btn-print', '⚙ Ayarlar', openSettings));
      nodes.push(fallback, dialogButton('btn-link', 'Vazgeç', closeDialog));
    }
    showDialog(nodes);
  }

  function openSettings() {
    var title = el('h2', '', '⚙ Ayarlar');
    title.id = 'dlg-title';
    var slug = repoSlug();
    var input = el('input', 'dlg-input');
    input.type = 'password';
    input.autocomplete = 'off';
    input.placeholder = 'github_pat_…';
    input.value = state.token;
    input.setAttribute('aria-label', 'GitHub erişim anahtarı');
    var buttons = el('div', 'dlg-btns');
    append(buttons,
      dialogButton('btn-ghost', 'Kapat', closeDialog),
      dialogButton('btn-print', 'Kaydet ve dene', function () {
        var token = input.value.trim();
        setState({ token: token });
        lsWrite(LS_GITHUB, { token: token });
        if (!token) { showToast('Anahtar silindi'); closeDialog(); render(true); return; }
        githubRequest('/actions/workflows/' + ACTION_WORKFLOW).then(function (res) {
          showToast(res.ok ? 'Anahtar çalışıyor ✓' : 'Anahtar kabul edilmedi (' + res.status + ')');
          if (res.ok) closeDialog();
          render(true);
        }).catch(function () { showToast('Denenemedi: bağlantı yok'); });
      }));
    showDialog([
      title,
      el('p', '', 'Quietvox\'a yazabilmek için GitHub erişim anahtarı (yalnızca bu cihazda saklanır):'),
      input,
      el('p', 'dlg-note', slug ? 'Repo: ' + slug : 'Bu adres GitHub Pages olmadığı için Quietvox\'a yazma kapalı.'),
      buttons
    ]);
  }

  /* ========================================================================
     OLAYLAR
     ======================================================================== */
  function selectTab(tab, focus) {
    setState({ tab: tab });
    if (!state.filterChosen) setState({ filter: defaultFilter(tab) });
    render(true);
    if (focus) $('#tab-' + tab).focus();
  }

  function bindEvents() {
    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () { selectTab(btn.getAttribute('data-tab'), false); });
      // Sekmeler arasında ok tuşlarıyla gezinme
      btn.addEventListener('keydown', function (ev) {
        if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return;
        ev.preventDefault();
        selectTab(state.tab === 'deliveries' ? 'returns' : 'deliveries', true);
      });
    });

    document.querySelectorAll('.filter').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setState({ filter: btn.getAttribute('data-filter'), filterChosen: true });
        render(true);
      });
    });

    $('#btn-refresh').addEventListener('click', function () { loadData(true); });
    $('#btn-settings').addEventListener('click', openSettings);
    $('#btn-theme').addEventListener('click', toggleTheme);
    $('#tile-overdue').addEventListener('click', function () {
      setState({ tab: 'returns', filter: 'overdue', filterChosen: true, hotel: '' });
      render(true);
      $('#list').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
    });

    // Tarih çubuğu
    $('#date-input').addEventListener('change', function (ev) { goToDate(ev.target.value); });
    $('#date-prev').addEventListener('click', function () { goToDate(addDays(viewDate() || state.today, -1)); });
    $('#date-next').addEventListener('click', function () { goToDate(addDays(viewDate() || state.today, 1)); });

    // Bugünün paneli: ilgili sekmeyi bugüne getir
    document.querySelectorAll('.tile[data-tab]').forEach(function (tile) {
      tile.addEventListener('click', function () {
        setState({ tab: tile.getAttribute('data-tab'), filter: 'today', filterChosen: true });
        render(true);
        $('#list').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
      });
    });

    // Pencere dışına dokununca kapat
    $('#dlg').addEventListener('click', function (ev) { if (ev.target === ev.currentTarget) closeDialog(); });

    $('#pv-close').addEventListener('click', closePreview);
    $('#pv-print').addEventListener('click', function () { window.print(); });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closePreview();
    });
    window.addEventListener('resize', updatePreviewScale);

    // Yazdırma bitince alanı temizle (önizleme açıksa açık kalsın).
    // Küçük gecikme: bazı mobil tarayıcılar olayı erken tetikler.
    window.addEventListener('afterprint', function () {
      window.setTimeout(function () {
        if (!document.body.classList.contains('pv-open')) clearPrintArea();
      }, 800);
    });

    // Sekme/uygulama yeniden görünür olunca yenile
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - lastLoadAt > MIN_REFRESH_GAP_MS) {
        loadData(false);
      }
    });
    window.addEventListener('online', function () { loadData(false); });

    // ~5 dakikada bir otomatik yenile (gün değişimi de burada yakalanır)
    window.setInterval(function () {
      if (document.visibilityState === 'visible') loadData(false);
    }, REFRESH_MS);
  }

  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () {
        /* Service worker kurulamazsa uygulama yine çalışır (yalnızca çevrimdışı desteği olmaz) */
      });
    });
  }

  /* ========================================================================
     BAŞLAT
     ======================================================================== */
  function init() {
    var today = istanbulDate(new Date());
    applyTheme();
    var github = lsRead(LS_GITHUB);
    var pending = lsRead(LS_PENDING);
    setState({
      today: today, tomorrow: addDays(today, 1), marks: loadMarks(),
      token: github && typeof github.token === 'string' ? github.token : '',
      pending: pending && typeof pending === 'object' && !Array.isArray(pending) ? pending : {}
    });
    bindEvents();
    render(true);
    loadData(false);
    registerServiceWorker();
  }

  init();
})();
</script>
</body>
